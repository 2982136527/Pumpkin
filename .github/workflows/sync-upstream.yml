name: Sync fork from upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream master into fork master
        run: |
          code=$(curl -s -o /tmp/sync.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/2982136527/Pumpkin/merge-upstream \
            -d '{"branch":"master"}')
          cat /tmp/sync.json
          if [ "$code" != "200" ] && [ "$code" != "409" ]; then
            echo "unexpected status: $code" >&2
            exit 1
          fi
